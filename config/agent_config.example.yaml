# ===== OpenClaw 插件 =====
# 支持 openclaw / claude / cursor / codex 清单。
# 扫描顺序：load.paths -> workspace/.openclaw/plugins -> ~/.openclaw/plugins -> npm_store。
# 只消费 manifest 静态字段和 skills，不执行插件内 TS/JS。
#
# plugins:
#   enabled: true
#   allow: []              # 空 = 全部允许；非空 = 仅启用列表内 id
#   deny: []               # 黑名单，优先于 allow
#   load:
#     paths:               # 额外扫描路径
#       - "~/Projects/oss/voice-call-extension"
#   slots:
#     memory: "memory-core"     # "none" 禁用；或由 <plugin-id> 提供
#     contextEngine: "none"
#   entries:                    # 单插件开关 / 配置覆盖
#     voice-call:
#       enabled: true
#       config:
#         provider: "twilio"
#   install_registry: "~/.openclaw/plugins"     # /plugin install 目标目录
#   npm_registry: "~/.openclaw/npm_store"       # npm 包安装目录（需 node+npm）

