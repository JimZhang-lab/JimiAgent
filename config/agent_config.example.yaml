# JimiAgent 配置模板
#
# 用法：
# 1. 复制为 config/agent_config.yaml
# 2. 替换占位符
# 3. 按实际接口调整 base_url
#
# 运行时配置统一在此；临时覆盖可用 JIMI_* 环境变量。

agent:
  # ===== 模型 =====
  model:
    provider: "openai"          # openai / anthropic
    model_id: "qwen3-next-80b"  # 模型名
    temperature: 0.7
    max_tokens: 8192
    streaming: true
    api_key: "sk-REPLACE_ME"            # 主模型 Key
    base_url: "https://api.openai.com/v1"  # OpenAI 兼容接口

    # 可选备选模型；按顺序回退。
    # fallbacks:
    #   - provider: "openai"
    #     model_id: "gpt-4o-mini"
    #     api_key: "sk-REPLACE_ME"
    #     base_url: "https://api.openai.com/v1"
    #   - provider: "anthropic"
    #     model_id: "claude-3-5-sonnet-20241022"
    #     api_key: "sk-ant-REPLACE_ME"

  # ===== Embedding =====
  embedding:
    model: "text-embedding-3-small"  # 支持自定义名
    api_key: ""                      # 空则复用 model.api_key
    base_url: ""                     # 空则复用 model.base_url

  # ===== 多模态 =====
  # 留空时自动回退到 model / embedding。
  # vlm:
  #   model_id: "qwen-vl-max"
  #   # 其余字段默认继承 model
  # vl_embedding:
  #   model: "multimodal-embedding-v1"
  #   # Key / URL 默认继承 embedding

  # ===== Workspace =====
  workspace: "./workspace"

  # ===== Skills 检索 =====
  skills:
    top_k: 3                    # 每次返回的 Skill 数
    similarity_threshold: 0.5   # vector_only 阈值
    index_persist_dir: "./data/skill_index"

    # --- Hybrid 检索 ---
    # 默认 hybrid：BM25 + Vector + RRF。
    # 降级：hybrid -> vector_only -> bm25_only -> 全量。
    retrieval_mode: "hybrid"          # hybrid / vector_only / bm25_only
    query_cache_ttl_seconds: 30       # 0 = 关闭缓存
    query_cache_size: 128             # 缓存上限
    exact_match_short_circuit: true   # skill_name / skill_key 直达
    bm25_weight_name: 3               # name 权重
    bm25_weight_description: 2        # description 权重

  # ===== 记忆 =====
  memory:
    backend: "sqlite"
    sqlite_path: "./data/memory.db"  # LangGraph checkpointer

    # --- 长期记忆 ---
    enabled: true                        # 总开关
    store_path: "./data/memory_store.db" # 独立 SQLite
    extract_on_compact: true             # compact 后抽取
    recall_max_inject: 5                 # 每轮注入条数
    dedup_threshold: 0.92                # 去重阈值
    embedding_model: "auto"              # auto / off / 自定义

    # --- 扩展项 ---
    extract_mode: "per_turn"      # off / on_compact / per_turn
    extract_timeout_seconds: 10   # per_turn 超时
    namespace: "auto"             # auto = agent_name
    procedural_inject_max: 10     # procedural 注入上限

  # ===== 会话 =====
  session:
    max_history_messages: 50       # 历史消息上限
    compact_threshold: 40          # 触发 compact
    default_think_level: "medium"  # low / medium / high

  # ===== 全盘文件 / Shell 安全层 =====
  # 打开后 Agent 可以读写全盘，但 dangerous 操作需要 confirm。
  # 关闭则退化为"仅 workspace 内"（老行为）。
  safety:
    enabled: true                  # 总开关
    confirm_mode: "auto"           # auto / ui / llm / off
    # - "auto": UI 通道可用则走 LangGraph interrupt 弹框；否则退化 llm
    # - "ui"  : 强制走 interrupt + TUI/前端弹框
    # - "llm" : 返回 [PENDING CONFIRM] 让 LLM 询问用户，用户答复后 LLM 带 confirm=true 重试
    # - "off" : 全放行（仅硬拒黑名单），不推荐
    auto_approve_workspace_writes: true    # workspace 内写无需 confirm
    confirm_timeout_seconds: 120           # UI 模式下等用户点击的超时
    # 额外黑名单（fnmatch 风格）；在内置黑名单外追加
    extra_path_deny: []
    # 额外命令 denylist（regex，命中即硬拒）
    extra_cmd_deny: []
    # 额外视为 safe 的命令头（如 kubectl/docker 只读子命令）
    extra_safe_cmd_heads: []

  # ===== Shell 工具 =====
  bash:
    enabled: false                 # bash 工具默认关；打开后受 safety 控制
    timeout_seconds: 30
    max_output_bytes: 8192

# ===== Gateway =====
gateway:
  host: "0.0.0.0"
  port: 18789
  # 生产环境请改为明确白名单。
  cors_origins:
    - "*"
    # - "http://localhost:5173"
    # - "https://yourdomain.com"

# ===== 渠道 =====
channels:
  webchat:
    enabled: true
  terminal:
    enabled: true
  # Webhook: POST /api/webhook/<name>
  # Body: {"sender_id":"...","message":"...","session_id":"可选"}
  # dmPolicy: open / pairing / closed
  # allowFrom 支持精确匹配、*、前缀通配。
  # Header: X-Jimi-Webhook-Secret
  # 管理命令: python cli.py pairing list|approve|revoke|add
  # webhook:
  #   enabled: true
  #   secret: ""                # 空则不校验
  #   session_prefix: "wh"      # sender_id 对应的 thread 前缀
  #   dmPolicy: "pairing"       # open / pairing / closed
  #   allowFrom: ["admin_*"]    # 静态白名单
  # Telegram（预留）
  # telegram:
  #   enabled: false
  #   mode: "long-poll"         # long-poll / webhook
  #   bot_token: ""

# ===== 日志 =====
logging:
  level: "INFO"                 # DEBUG / INFO / WARNING / ERROR
  format: "rich"                # rich / plain
  output: "console"             # console / file / both
  file_path: "./logs/jimi.log"  # 相对 project root
  rotate_mb: 10                 # 单文件上限（MB）
  backup_count: 5               # 轮转保留数

# ===== 定时任务 =====
# Gateway 启动后按 cron 触发。
# 每个 job 默认使用独立 session：cron-<id>。
scheduler:
  enabled: false                # 总开关
  tick_seconds: 30              # 轮询间隔（秒）
  jobs: []
  # 示例：
  # jobs:
  #   - id: daily-brief
  #     schedule: "0 9 * * *"     # 每天 09:00
  #     prompt: "用三句话总结今天需要关注的事"
  #     session_title: "每日提醒"
  #     enabled: true
  #   - id: weekly-recap
  #     schedule: "0 18 * * 5"    # 每周五 18:00
  #     prompt: "回顾本周重要会话的要点"
  #     enabled: true
  #   - id: evolver-hourly        # kind=evolver 时不走 LLM
  #     kind: evolver             # 直接调 agent.evolver.run_cycle
  #     schedule: "0 * * * *"
  #     strategy: balanced        # balanced/innovate/harden/repair-only
  #     enabled: false

# ===== bash / shell 工具 =====
# 开启后可在 workspace 内执行命令。
# 防护：allowlist -> 危险模式拒绝 -> 写操作 confirm -> cwd/timeout/截断。
# agent:
#   bash:
#     enabled: false
#     allowlist: ["git", "ls", "cat", "pwd", "python", "pip", "node", "npm"]
#     timeout_seconds: 30
#     max_output_bytes: 4096

