<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JimiAgent - 基于 LangChain 的个人 AI 助手">
    <title>JimiAgent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app" id="app">
        <!-- 侧栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">JA</span>
                    <span class="logo-text">JimiAgent</span>
                </div>
                <button class="btn-icon" id="btn-new-session" title="新建对话">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>

            <div class="session-list" id="session-list">
                <!-- 动态填充 -->
            </div>

            <div class="sidebar-footer">
                <div class="status-indicator" id="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">连接中...</span>
                </div>
                <button class="btn-icon" id="btn-toggle-sidebar" title="收起侧边栏">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
                </button>
            </div>
        </aside>

        <!-- 主区 -->
        <main class="chat-main">
            <header class="chat-header">
                <button class="btn-icon mobile-menu" id="btn-menu" title="菜单">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="chat-title" id="chat-title">JimiAgent</div>
                <div class="chat-subtitle" id="chat-subtitle">个人 AI 助手</div>
            </header>

            <div class="chat-messages" id="chat-messages">
                <div class="welcome-message" id="welcome-message">
                    <div class="welcome-icon">JA</div>
                    <h2>JimiAgent</h2>
                    <p>基于 LangChain / LangGraph 构建的个人 AI 助手</p>
                    <div class="quick-actions">
                        <button class="quick-action" data-message="你能做什么？">你能做什么？</button>
                        <button class="quick-action" data-message="/status">查看系统状态</button>
                        <button class="quick-action" data-message="列出可用的 Skills">查看 Skills</button>
                        <button class="quick-action" data-message="今天是几号？">今天日期</button>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <!-- 附件预览 -->
                <div class="attachment-bar" id="attachment-bar" hidden></div>
                <div class="input-wrapper" id="input-wrapper">
                    <button
                        class="btn-icon btn-attach"
                        id="btn-attach"
                        title="附加图片（也支持直接拖拽或粘贴）"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <input type="file" id="file-input" accept="image/*" multiple hidden>
                    <textarea
                        id="message-input"
                        placeholder="输入消息... (Enter 发送, Shift+Enter 换行；可拖/粘贴图片)"
                        rows="1"
                        autofocus
                    ></textarea>
                    <button class="btn-send" id="btn-send" title="发送">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
                <div class="input-hint">
                    <span id="model-info">-</span>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
